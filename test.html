<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HexaStudio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1e1e1e;color:#d4d4d4;height:100vh;overflow:hidden}
</style>
</head>
<body>

<div id="app">
<h1 style="padding:20px;color:#007acc" id="title">HexaStudio</h1>
<button id="testBtn" style="padding:10px 20px;margin:20px;font-size:16px;cursor:pointer;background:#007acc;color:white;border:none;border-radius:6px">Click Me</button>
<div id="output" style="padding:20px"></div>
</div>

<script>
alert('Script loaded!');
document.getElementById('testBtn').onclick = function() {
    alert('Button clicked!');
    document.getElementById('output').innerHTML = '<p style="color:#4ec9b0">It works!</p>';
};
</script>
</body>
</html>
